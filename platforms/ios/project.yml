name: MoreMoney
options:
  bundleIdPrefix: de.moremoney
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
targets:
  MoreMoney:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [de.moremoney.quote-refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.moremoney.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MoreMoney
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  MoreMoneyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MoreMoney
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MoreMoneyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MoreMoney
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoreMoney
schemes:
  MoreMoney:
    build:
      targets:
        MoreMoney: all
    test:
      targets: [MoreMoneyTests, MoreMoneyUITests]
